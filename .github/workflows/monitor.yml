name: Shooflive Monitor

on:
  schedule:
    # 11:00 مساءً بتوقيت القاهرة، يوم الاثنين
    - cron: '0 21 * * 1'
  
  workflow_dispatch:  # عشان تقدر تشغله يدويًا للتجربة

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      
      - name: Run monitor
        run: python main.py
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-output
          path: |
            monitor.log
            state.json
